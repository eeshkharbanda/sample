name: Daily AI News Agent

on:
  schedule:
    - cron: '30 2 * * *'   # 8:00 AM IST (UTC+5:30) = 02:30 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily AI News Agent
        env:
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python agent/daily_ai_news_agent.py

      - name: Commit new skill to repo
        run: |
          git config user.name  "Daily AI News Agent"
          git config user.email "action@github.com"
          git add skills/ agent/state.json
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "feat(skill): daily AI skill $(date +%Y-%m-%d)"
          git push origin ${{ github.ref_name }}
